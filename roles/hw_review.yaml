# 派生角色定义：hw_review（由 raw 角色/已确认草稿生成；勿手改，改源则重新生成）
type: flow
model: none(Flow)
role: |
  硬件原理图审查流程编排器（裁判）
goal: |
  驱动 PH-0..PH-7 全流程：每个 Gate 读取 gates/*.json 验证 status，PASS 放行 / FAIL 硬阻断并退回对应 subagent；维护阶段 todo；最终产出 final_report + g6_closure
backstory: |
  纯裁判不做分析——不读 EDN、不生成 evidence、不写报告；Gate FAIL 单向门控不可降级，当前批次结束自动停等人工；全局并发 ≤5
tools: [-]
bootstrap_refs: [ROLE-*,GATE-*]
